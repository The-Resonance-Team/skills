# Dependabot baseline — copy to .github/dependabot.yml, then drop the
# ecosystem entries your repo has no version source for (and add any the
# table in rules/dependabot.md misses for your stack).
version: 2

updates:
  # package.json dependencies. `npm` is correct for a pnpm repo. A repo with a
  # bun.lock needs `bun` here, not `npm`: npm_and_yarn cannot read bun.lock and
  # aborts the job. See rules/dependabot.md section 1a.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore(dev)'
      include: 'scope'
    open-pull-requests-limit: 5

  # action refs in .github/workflows (SHA pins stay SHA pins)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'ci'
    open-pull-requests-limit: 5

  # NOTE: there is no ecosystem for the `packageManager` field
  # (`package-manager-versions` is not a real value — Dependabot rejects it).
  # Bump it by hand with the lockfile (`pnpm install --lockfile-only`) in one
  # PR — see rules/dependabot.md.

  # FROM image tags in Dockerfiles — list every directory holding one
  # (a file glob is NOT valid here; use plain directory paths).
  # A repo with ONLY a docker-compose.yml needs `docker-compose` here instead;
  # `docker` never reads compose files and fails with dependency_file_not_found.
  - package-ecosystem: 'docker'
    directories:
      - '/apps/api'
      - '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
    open-pull-requests-limit: 5
