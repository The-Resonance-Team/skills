name: PR Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

  schedule:
    - cron: "0 9 * * 1"  # Weekly: Monday 9am UTC

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to analyze (leave empty for all open PRs)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Setup OpenCode skill
        run: |
          mkdir -p .opencode/skills
          cp -r skills/pr-analysis .opencode/skills/pr-analysis

      - name: Run PR Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          PR_NUMBER=""
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          if [ -n "$PR_NUMBER" ]; then
            # Single PR analysis
            opencode run --auto --dir . \
              "Analyze PR #${PR_NUMBER} in ${{ github.repository }}. \
               Use the pr-analysis skill from .opencode/skills/pr-analysis/. \
               Read the PR diff, check for linked tickets, validate AC, \
               and post a stakeholder-readable report as a PR comment. \
               Post to Linear if a ticket is linked."
          else
            # Weekly/CD: analyze all open PRs
            gh pr list --state open --json number --jq '.[].number' | while read PR; do
              echo "=== Analyzing PR #${PR} ==="
              opencode run --auto --dir . \
                "Analyze PR #${PR} in ${{ github.repository }}. \
                 Use the pr-analysis skill from .opencode/skills/pr-analysis/. \
                 Read the PR diff, check for linked tickets, validate AC, \
                 and post a stakeholder-readable report as a PR comment. \
                 Post to Linear if a ticket is linked."
            done
          fi
