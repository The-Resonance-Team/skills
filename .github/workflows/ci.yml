name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rules: ${{ steps.filter.outputs.rules }}
      codemode: ${{ steps.filter.outputs.codemode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v4.0.3
        id: filter
        with:
          filters: |
            rules:
              - 'agent-rules-mcp/**'
              - 'rules/**'
              - 'workflows/**'
              - 'CONTEXT.md'
              - '.github/workflows/**'
              - '.github/tests/**'
            codemode:
              - 'opencode-codemode-mcp/**'
              - '.github/workflows/**'
              - '.github/tests/**'

  rules:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.rules == 'true'
    uses: ./.github/workflows/_mcp-checks.yml
    with:
      package: agent-rules-mcp

  codemode:
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.codemode == 'true'
    uses: ./.github/workflows/_mcp-checks.yml
    with:
      package: opencode-codemode-mcp
