name: check-router-links

on:
  push:
    branches: [main]
    paths: [CONTEXT.md, rules/**, workflows/**, .github/workflows/check-router-links.yml]
  pull_request:
    paths: [CONTEXT.md, rules/**, workflows/**]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every rule URL in the router and rule/workflow files
        run: |
          fail=0
          for url in $(grep -hoE 'https://raw\.githubusercontent\.com/[^ `|)]+' CONTEXT.md rules/*.md workflows/*.md | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            if [ "$code" != 200 ]; then echo "BROKEN ($code): $url"; fail=1; fi
          done
          exit $fail
