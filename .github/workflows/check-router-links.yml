name: check-router-links

on:
  push:
    branches: [main]
    paths: [rules/**, workflows/**, .github/workflows/check-router-links.yml]
  pull_request:
    paths: [rules/**, workflows/**]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Fetch raw rule and workflow URLs
        run: |
          fail=0
          # Brace URLs in rule docs are shorthand for a set of files, not fetchable URLs.
          for url in $(grep -hoE 'https://raw\.githubusercontent\.com/[^ `|)]+' rules/*.md workflows/*.md | grep -v '{' | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            if [ "$code" != 200 ]; then echo "BROKEN ($code): $url"; fail=1; fi
          done
          exit $fail
